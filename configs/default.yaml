# MonoGeoFlightLog default configuration.
#
# Every training / evaluation entry point reads this file (or a copy of it) so
# that runs are reproducible and the README numbers can be traced back to one
# place. Override any key on the CLI with --set key.subkey=value where the
# subcommand supports it.

seed: 0
device: cpu
# Pin BLAS/torch threads so CPU timings are stable between runs.
num_threads: 4

data:
  # Which sequence the *default* CLI runs use. One of forward | orbit | descent,
  # or a real dataset spec such as "kitti:00" / "euroc:MH_01_easy".
  sequence: forward
  # Held-out sequence used for evaluation (never trained on).
  eval_sequence: orbit
  # Domain-shift sequence (altitude change between train and test distributions).
  shift_sequence: descent
  height: 128
  width: 416
  num_frames: 48
  # Frames rendered/generated per second of flight log is irrelevant here; the
  # trajectory is parameterised in metres per frame instead.
  synth_seed: 0
  # Root directory scanned for real datasets (KITTI odometry / EuRoC).
  data_root: data
  cache: true

synth:
  # Camera used by the synthetic renderer.
  fov_deg: 62.0
  altitude: 9.0
  speed: 1.6
  distortion: [-0.12, 0.03, 0.0012, -0.0008, 0.0]

calib:
  checkerboard: [6, 7]      # inner corners (rows, cols)
  square_size: 0.04         # metres
  num_views: 20
  image_size: [480, 640]    # (height, width)

twoview:
  ratio_thresh: 0.75
  ransac_prob: 0.999
  ransac_threshold_px: 1.0
  max_features: 4000
  # Two-view geometry needs parallax: +/-1 frame at 1.6 m/frame against ~33 m
  # depth is only ~5% baseline/depth, and the translation direction becomes
  # ill-conditioned. Two frames apart doubles the baseline. Step 4 reports the
  # short-baseline degradation explicitly.
  frame_gap: 2
  # Report the headline number on the first pair plus a median over N pairs.
  num_pairs: 12

depth:
  encoder: resnet18
  pretrained: false         # ImageNet weights are optional; offline default off
  num_scales: 4
  min_depth: 0.5
  max_depth: 120.0
  # Number of adjacent frames used per training sample (target + 2 sources).
  frame_ids: [0, -1, 1]

train_depth:
  epochs: 8
  batch_size: 4
  lr: 0.0001
  num_workers: 0
  log_every: 1
  # Monodepth2 loss weights.
  w_photometric: 1.0
  w_smoothness: 0.001
  ssim_weight: 0.85
  l1_weight: 0.15
  use_automask: true
  use_min_reproj: true
  out_dir: runs/depth
  # Limit the number of training triplets for CPU budget.
  max_samples: 240

pointmap:
  patch_size: 16
  embed_dim: 128
  encoder_depth: 4
  decoder_depth: 2
  num_heads: 4
  head_hidden: 128
  # Prefer local DUSt3R/MASt3R weights if the user has them.
  pretrained_path: null

train_pointmap:
  epochs: 12
  batch_size: 2
  lr: 0.0003
  num_workers: 0
  conf_weight: true
  lr_scale: 0.1
  max_samples: 160
  out_dir: runs/pointmap

eval:
  # Depth range masking for the standard metrics.
  min_depth: 1.0
  max_depth: 120.0
  median_scaling: true
  num_frames: 40

stress:
  corruptions: [motion_blur, low_texture, low_light, jpeg_artifacts]
  severities: [1, 2, 3]

export:
  onnx_opset: 17
  onnx_path: artifacts/depth_net.onnx
  warmup: 10
  runs: 50

cpp:
  warmup: 10
  runs: 50
