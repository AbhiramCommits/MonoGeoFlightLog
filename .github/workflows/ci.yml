name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the CPU runs in CI short and deterministic.
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"

jobs:
  python:
    name: Python (tests + lint)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system OpenCV (needed by opencv-python's runtime libs)
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Format check (black)
        run: black --check src tests scripts

      - name: Tests
        run: pytest -q --maxfail=1

      - name: Smoke pipeline (calibrate + two-view) to prove the CLI runs
        run: |
          monogeo calibrate --out results/calibration.json
          monogeo two-view --sequence forward --pairs 4 --out results/two_view_baseline.json
        continue-on-error: true

  cpp:
    name: C++ (build, ctest parity)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenCV and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libopencv-dev

      # The ONNX graph is not committed (see .gitignore: *.onnx), so CI has to
      # produce one. A single training epoch is enough to exercise the export,
      # the C++ build and the parity check end to end.
      - name: Set up Python (for the ONNX export step)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Train one epoch and export ONNX
        run: |
          monogeo train-depth --epochs 1
          monogeo export --out artifacts/depth_net.onnx

      - name: Configure
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release -DMONOGEO_ARTIFACTS=${{ github.workspace }}/artifacts

      - name: Build
        run: cmake --build cpp/build -j

      - name: Test (parity against the PyTorch output)
        run: ctest --test-dir cpp/build --output-on-failure

      - name: Benchmark
        run: |
          ./cpp/build/depth_infer --onnx artifacts/depth_net.onnx \
            --input artifacts/sample_input.bin \
            --compare artifacts/python_output.bin \
            --dump cpp_output.bin --dump-png cpp_depth.png \
            --timing-json results/cpp_timing.json --runs 50 --warmup 10 --quiet
          python scripts/bench_cpp_vs_python.py

      - name: Upload timing artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-timing
          path: |
            results/cpp_timing.json
            results/cpp_vs_python.json
            results/python_timing.json
          if-no-files-found: warn
